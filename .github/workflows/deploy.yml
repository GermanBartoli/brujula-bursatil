name: Verificar y publicar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brujula-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Sincronizar secretos de producción
        if: github.event_name != 'pull_request'
        run: node scripts/sync-cloudflare-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          MARKETAUX_API_KEY_BACKUP: ${{ secrets.MARKETAUX_API_KEY_BACKUP }}
          MARKETAUX_API_KEY_THIRD: ${{ secrets.MARKETAUX_API_KEY_THIRD }}
      - name: Publicar en Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name brujula-bursatil --branch main
